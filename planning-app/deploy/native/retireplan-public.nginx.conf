# Isolated RetirementExpert host; do not replace other virtual hosts.
server {
    listen 80;
    listen [::]:80;
    server_name plan.retirementexpert.si;
    access_log off;
    error_log /dev/null crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/retireplan-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://plan.retirementexpert.si$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name plan.retirementexpert.si;
    ssl_certificate /etc/letsencrypt/live/plan.retirementexpert.si/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plan.retirementexpert.si/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:retireplanTLS:10m;
    ssl_session_timeout 1d;
    server_tokens off;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 12m;
    add_header Strict-Transport-Security "max-age=86400" always;

    # Native dispatcher is loopback-only even when the public portal is connected.
    location = /api/operations/dispatch { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3117;
        proxy_http_version 1.1;
        proxy_set_header Host plan.retirementexpert.si;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite rather than append attacker-provided forwarding values.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host plan.retirementexpert.si;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
